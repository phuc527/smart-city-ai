services:
  backend:
    build:
      context: ./backend
    container_name: smart-city-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend./frontend
    container_name: smart-city-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000/ws/detection
    depends_on:
      - backend
    restart: unless-stopped
